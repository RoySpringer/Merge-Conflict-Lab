name: Publiceer GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Haal repository op
        uses: actions/checkout@v6
      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload statische website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publiceer website
        id: deployment
        uses: actions/deploy-pages@v4
